<!DOCTYPE html>
<html lang="ko" style="--accent: #ffadc6;" class="crit-shell-real"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crit — 소개</title>
<style>
  :root {
    --accent:#B26A9E;
    --bg:     color-mix(in srgb, var(--accent) 5%,  #131216);
    --panel:  color-mix(in srgb, var(--accent) 8%, #1d1b21);
    --panel2: color-mix(in srgb, var(--accent) 10%, #26242c);
    --line:   color-mix(in srgb, var(--accent) 18%, #34313a);
    --text:   color-mix(in srgb, var(--accent) 5%,  #f0edf3);
    --dim:    color-mix(in srgb, var(--accent) 12%, #9a95a0);
    --desc:   color-mix(in srgb, var(--accent) 12%, #d1cdd8);
  }
  body.light {
    --bg:     color-mix(in srgb, var(--accent) 3%,  #f7f6f8);
    --panel:  color-mix(in srgb, var(--accent) 4%,  #ffffff);
    --panel2: color-mix(in srgb, var(--accent) 5%,  #efedf1);
    --line:   color-mix(in srgb, var(--accent) 13%, #d9d6dd);
    --text:   color-mix(in srgb, var(--accent) 8%, #27242a);
    --dim:    color-mix(in srgb, var(--accent) 9%, #6f6a76);
    --desc:   color-mix(in srgb, var(--accent) 15%, #565060);
  }
  * { box-sizing:border-box; }
  html { scrollbar-width:thin; scrollbar-color: color-mix(in srgb, var(--accent) 45%, var(--line)) transparent; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb, var(--accent) 62%, var(--line)); }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; line-height:1.65; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 16px 80px; }

  /* 툴바 */
  .toolbar { position:sticky; top:0; z-index:3; background:color-mix(in srgb, var(--bg) 88%, transparent);  /* 스티커(4)가 위로 침범해도 보이게 스티커보다 아래 */
    backdrop-filter:blur(8px); display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding:10px 2px; margin-bottom:14px; border-bottom:1px solid var(--line); }
  .toolbar .ttl { font-size:14px; font-weight:700; margin-right:auto; }
  .toolbar button { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .toolbar button.on { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .iconbtn { display:flex; align-items:center; justify-content:center; padding:5px 9px; }
  .iconbtn.on { color:var(--accent); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 14%, var(--panel2)); }
  .settings { position:relative; }
  .spanel { display:none; position:absolute; right:0; top:36px; z-index:20; width:270px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;
    box-shadow:0 10px 30px #0008; }
  .spanel.open { display:block; }
  .spanel h4 { margin:0 0 8px; font-size:12.5px; color:var(--dim); font-weight:600; }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:8px; }
  .srow input[type=color] { width:34px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  .srow label { display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--dim); cursor:pointer; }
  .cwrap { display:flex; align-items:center; gap:6px; }
  .hexin { width:74px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-size:12px; padding:4px 6px; font-family:Consolas,"D2Coding",monospace; }
  input::placeholder, textarea::placeholder { color:color-mix(in srgb, var(--accent) 30%, var(--dim)); }

  /* 커스텀 컨트롤 */
  input[type=checkbox], input[type=radio] {
    appearance:none; -webkit-appearance:none; width:15px; height:15px; flex:none;
    border:1.5px solid var(--line); background:var(--panel2); cursor:pointer;
    margin:0 3px 0 0; vertical-align:-2px; transition:.12s; }
  input[type=checkbox] { border-radius:4.5px; }
  input[type=radio] { border-radius:50%; }
  input[type=checkbox]:hover, input[type=radio]:hover {
    border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
  input[type=checkbox]:checked { background:var(--accent)
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 7"/></svg>')
    center/10px 10px no-repeat; border-color:var(--accent); }
  input[type=radio]:checked { background:var(--accent); border-color:var(--accent);
    box-shadow:inset 0 0 0 3px var(--panel); }
  /* 슬라이더 */
  input[type=range] { appearance:none; -webkit-appearance:none; width:100%; height:6px;
    background:var(--panel2); border:1px solid var(--line); border-radius:999px; outline:none; }
  input[type=range]::-webkit-slider-thumb { appearance:none; -webkit-appearance:none;
    width:16px; height:16px; border-radius:50%; background:var(--accent);
    border:3px solid color-mix(in srgb, var(--accent) 30%, var(--panel)); cursor:pointer; }
  input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%;
    background:var(--accent); border:3px solid color-mix(in srgb, var(--accent) 30%, var(--panel)); cursor:pointer; }

  /* 카드 */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:20px 22px; margin-bottom:14px; }
  .card h2 { margin:0 0 14px; font-size:13px; color:var(--dim); font-weight:700;
    letter-spacing:.3px; display:flex; align-items:center; gap:8px; }
  .card h2::after { content:""; flex:1; border-top:1px solid var(--line); }

  /* 헤더 배너 + 스티커 */
  .banner { position:relative; height:190px; margin:-20px -22px 14px; border-radius:15px 15px 0 0;
    background-color:var(--panel2); background-size:cover; background-position:center;
    border-bottom:1px solid var(--line); }
  .banner.noimg { background-image:linear-gradient(135deg,
    color-mix(in srgb, var(--accent) 22%, var(--panel2)),
    color-mix(in srgb, var(--accent) 8%, var(--panel2))); }
  .bph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:12.5px; pointer-events:none; }
  .banner:not(.noimg) .bph { display:none; }
  .bctrl { position:absolute; top:10px; right:10px; display:flex; gap:6px; z-index:6; }  /* 버튼은 스티커보다 위 */
  .bctrl button { background:color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter:blur(6px);
    color:var(--text); border:1px solid var(--line); border-radius:8px; padding:4px 10px;
    font-size:11.5px; cursor:pointer; font-family:inherit; }
  .bctrl button:hover { border-color:var(--accent); }
  .sticker { position:absolute; cursor:default; touch-action:none; z-index:4; user-select:none; }  /* 아바타(3)보다 위 */
  .sticker img { width:100%; display:block; pointer-events:none; }
  .sticker .sdel, .sticker .srsz { position:absolute; display:none; }
  body:not(.preview) .sticker.sel .sdel, body:not(.preview) .sticker.sel .srsz { display:flex; }
  .sticker .sdel { top:-9px; right:-9px; width:18px; height:18px; border-radius:50%;
    background:#a84848; color:#fff; border:none; font-size:11px; line-height:1;
    align-items:center; justify-content:center; cursor:pointer; }
  .sticker .srsz { bottom:-7px; right:-7px; width:14px; height:14px; border-radius:50%;
    background:var(--accent); border:2px solid var(--panel); cursor:nwse-resize; }
  .sticker .srot { top:-7px; left:-7px; width:14px; height:14px; border-radius:50%;
    background:var(--panel2); border:2px solid var(--accent); cursor:grab; position:absolute; display:none; }
  body:not(.preview) .sticker.sel .srot { display:flex; }
  body.preview .sticker { pointer-events:none; }
  body.preview .bctrl { display:none; }
  body.preview .bph { display:none; }

  /* 프로필 */
  .profile { display:flex; gap:18px; align-items:flex-start; }
  .pimg { flex:none; width:96px; height:96px; border-radius:22px; background:var(--panel2);
    border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden; transition:.15s; position:relative;
    margin-top:-46px; z-index:3; box-shadow:0 0 0 3.5px var(--panel); }
  .pimg:hover { border-color:var(--accent); }
  .pimg img { width:100%; height:100%; object-fit:cover; }
  .pimg .ph { font-size:11px; color:var(--dim); text-align:center; line-height:1.5; padding:6px; }
  .pmain { flex:1; min-width:0; }
  .nick { font-size:22px; font-weight:800; letter-spacing:-.5px; background:none; border:none;
    color:var(--text); font-family:inherit; width:100%; padding:0; outline:none;
    border-bottom:1.5px dashed transparent; }
  .tagline { font-size:13.5px; color:var(--desc); background:none; border:none; width:100%;
    font-family:inherit; padding:0 0 0 7px; outline:none; margin-top:2px; border-bottom:1.5px dashed transparent;
    resize:none; overflow:hidden; line-height:1.65; }
  .mainintro { width:100%; background:none; border:none; color:var(--desc); font-family:inherit;
    font-size:13.5px; line-height:1.8; outline:none; resize:none; overflow:hidden; padding:0;
    border-left:3px solid transparent; }
  body:not(.preview) .mainintro { border-left:3px solid color-mix(in srgb, var(--accent) 30%, var(--line));
    padding-left:12px; }
  body:not(.preview) .mainintro:focus { border-left-color:var(--accent); }
  .linkbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .linkbtn { display:inline-flex; align-items:center; gap:7px; background:var(--panel2);
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:10px;
    padding:8px 18px; font-size:13px; font-weight:600; color:var(--text); text-decoration:none; }
  .linkbtn:hover { background:color-mix(in srgb, var(--accent) 16%, var(--panel2)); }
  .linkbtn svg { width:13px; height:13px; color:var(--dim); }
  body:not(.preview) .nick:hover, body:not(.preview) .nick:focus,
  body:not(.preview) .tagline:hover, body:not(.preview) .tagline:focus {
    border-bottom-color:color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .meta { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:var(--dim); }
  .meta .mitem { display:flex; align-items:center; gap:6px; }
  .meta input { background:none; border:none; color:var(--text); font-family:inherit; font-size:12.5px;
    outline:none; padding:0; border-bottom:1.5px dashed transparent; width:130px; }
  body:not(.preview) .meta input:hover, body:not(.preview) .meta input:focus {
    border-bottom-color:color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .meta svg { width:13px; height:13px; flex:none; }

  /* 세그먼트 (포지션) */
  .seg { display:inline-flex; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:3px; gap:3px; }
  .seg button { background:none; border:none; color:var(--dim); font-family:inherit;
    font-size:13px; padding:5px 16px; border-radius:7px; cursor:pointer; font-weight:600; }
  .seg button.on { background:var(--accent); color:#fff; }

  /* 태그/칩 */
  .tagrow { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .tag { display:inline-flex; align-items:center; gap:6px; border-radius:999px;
    padding:2px 12px; font-size:12.5px; font-weight:600; cursor:default;
    color:color-mix(in srgb, var(--accent) 52%, var(--text));
    background:color-mix(in srgb, var(--accent) 14%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line)); }
  .tag .x { cursor:pointer; color:var(--dim); font-weight:400; line-height:1; }
  .tag .x:hover { color:var(--text); }
  .tag.mine { background:color-mix(in srgb, #c85a5a 14%, var(--panel2));
    border-color:color-mix(in srgb, #c85a5a 45%, var(--line));
    color:color-mix(in srgb, #c85a5a 62%, var(--text)); }
  .genre { border-radius:999px; padding:2px 14px; font-size:12.5px; font-weight:600;
    background:var(--panel2); border:1px solid var(--line); color:var(--dim);
    cursor:pointer; font-family:inherit; transition:.12s; }
  .genre.on { background:color-mix(in srgb, var(--accent) 18%, var(--panel2));
    border-color:var(--accent); color:color-mix(in srgb, var(--accent) 52%, var(--text)); }
  .genre.bad.on { background:color-mix(in srgb, #c85a5a 16%, var(--panel2));
    border-color:#c85a5a; color:color-mix(in srgb, #c85a5a 62%, var(--text)); }
  .tagadd { display:flex; gap:6px; margin-top:10px; }
  .tagadd input { flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-family:inherit; font-size:12.5px; padding:5px 12px; outline:none; line-height:1.65; }
  .tagadd input:focus { border-color:var(--accent); }
  .tagadd button { background:color-mix(in srgb, var(--accent) 16%, var(--panel2));
    color:color-mix(in srgb, var(--accent) 75%, var(--text));
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px;
    padding:5px 14px; font-size:12.5px; cursor:pointer; font-family:inherit; line-height:1.65; font-weight:600; }

  /* 게이지 */
  .gauge { margin-bottom:16px; }
  .gauge:last-child { margin-bottom:2px; }
  .glabels { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-bottom:6px; }
  .glabels b { color:var(--text); font-size:12.5px; }

  /* 뱃지 줄 */
  .brow { display:flex; gap:10px; margin-bottom:10px; align-items:flex-start; }
  .brow .blabel { width:110px; flex:none; background:none; border:none; color:var(--dim);
    font-family:inherit; font-size:13px; font-weight:600; outline:none; padding:5px 0;
    border-bottom:1.5px dashed transparent; }
  body:not(.preview) .brow .blabel:hover, body:not(.preview) .brow .blabel:focus {
    border-bottom-color:color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .brow .bwrap { flex:1; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .badd { display:inline-flex; gap:4px; }
  .badd input { width:110px; background:var(--panel2); border:1px solid var(--line); border-radius:999px;
    color:var(--text); font-family:inherit; font-size:12.5px; padding:4px 12px; outline:none; line-height:1.65; }
  .badd input:focus { border-color:var(--accent); }
  .badd button { background:color-mix(in srgb, var(--accent) 16%, var(--panel2)); color:var(--text);
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:999px;
    padding:4px 12px; font-size:12.5px; cursor:pointer; font-family:inherit; line-height:1.65; }
  .brow .del { background:none; border:none; color:var(--dim); cursor:pointer; padding:6px 4px;
    display:flex; border-radius:6px; flex:none; }
  .brow .del:hover { color:#e08a8a; background:var(--panel2); }
  body.preview .badd, body.preview .brow .del { display:none; }

  /* 커스텀 항목 */
  .crow { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .crow input { background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-family:inherit; font-size:13px; padding:6px 10px; outline:none; }
  .crow input:focus { border-color:var(--accent); }
  .crow .ck { width:130px; flex:none; font-weight:600; }
  .crow .cv { flex:1; }
  .crow .del { background:none; border:none; color:var(--dim); cursor:pointer; padding:4px;
    display:flex; border-radius:6px; }
  .crow .del:hover { color:#e08a8a; background:var(--panel2); }
  .addbtn { background:var(--panel2); border:1px dashed var(--line); border-radius:8px;
    color:var(--dim); font-family:inherit; font-size:12.5px; padding:7px; width:100%;
    cursor:pointer; margin-top:2px; }
  .addbtn:hover { border-color:var(--accent); color:var(--text); }

  /* 미리보기 모드: 편집 장치 숨김 */
  body.preview .tagadd, body.preview .addbtn, body.preview .tag .x, body.preview .crow .del,
  body.preview #linkrows { display:none; }
  body.preview .pimg { border-style:solid; cursor:default; }
  body.preview .genre:not(.on) { display:none; }
  body.preview .genre { cursor:default; }
  body.preview input, body.preview textarea { pointer-events:none; }
  body.preview .seg button:not(.on) { display:none; }
  body.preview .seg { background:none; border:none; padding:0; }
  /* 게시본에서는 이 세그먼트를 정적 칩(연한 배경+얇은 테두리)으로 바꿔서 굽는데, 앱 미리보기는
     그냥 진한 색으로 채워진 원래 버튼 스타일이 그대로 남아 둘이 달라 보였다 - 게시본과 동일하게 */
  body.preview .seg button.on { background:color-mix(in srgb, var(--accent) 18%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    color:color-mix(in srgb, var(--accent) 60%, var(--text)); border-radius:999px; padding:3px 12px; }

  footer { margin-top:24px; color:var(--dim); font-size:12px; text-align:center; }

  /* 모달/오버레이 (공통) */
  .overlay { position:fixed; inset:0; z-index:60; background:#0008; display:flex; align-items:center; justify-content:center; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; width:300px; }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .hint { font-size:11.5px; color:var(--dim); margin:6px 0 0; }
  .dropzone { border:2px dashed var(--line); border-radius:12px; padding:30px 12px;
    text-align:center; color:var(--dim); font-size:13px; cursor:pointer; transition:.15s; }
  .dropzone.over { border-color:var(--accent); color:var(--text);
    background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .mbtns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .mbtns button { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit; }
  .mbtns button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .mbtns button.danger { background:#a84848; border-color:#a84848; color:#fff; }
  .pwwrap { position:relative; }
  .pwwrap input { width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:7px 36px 7px 10px; font-size:13px; font-family:inherit; }
  .eyebtn { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none;
    border:none; color:var(--dim); cursor:pointer; padding:4px; display:flex; }
  .eyebtn:hover { color:var(--text); }

  /* 상단 전역 메뉴 */
  .topnav { display:flex; gap:6px; align-items:center; padding:2px 2px 0; margin-bottom:6px; padding-bottom:9px;
    border-bottom:1px solid var(--line); }
  .navid { display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:800;
    letter-spacing:-.3px; margin-right:10px; padding:2px 2px; }
  .navgear { margin-left:auto; display:flex; padding:6px !important; border-radius:8px !important; }
  .topnav a, .topnav span.nv { padding:5px 14px; border-radius:999px; font-size:12.5px;
    color:var(--dim); text-decoration:none; border:1px solid transparent; transition:.12s; }
  .topnav a:hover { color:var(--text); border-color:var(--line); }
  .topnav .on { background:color-mix(in srgb, var(--accent) 16%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    color:var(--text); font-weight:600; }
  .topnav .memo { opacity:.55; cursor:help; }
